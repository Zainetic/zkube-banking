services:
  redis-cache:
    image: redis:7.2-alpine
    container_name: zkube-redis
    ports:
      - "6379:6379"
    networks:
      - zkube-network
    command: redis-server --save 60 1 --loglevel warning

  postgres-db:
    image: postgres:16-alpine
    container_name: zkube-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password 
      POSTGRES_DB: zkube_chaos
    ports:
      - "5434:5432"  
    networks:
      - zkube-network
    volumes:
      - postgres-data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: zkube-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@zkube.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    networks:
      - zkube-network
    depends_on:
      - postgres-db

networks:
  zkube-network:
    driver: bridge

volumes:
  postgres-data: